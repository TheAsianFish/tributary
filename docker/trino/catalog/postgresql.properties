# The warehouse, through the read-only role (its sessions default to read-only
# transactions), so nothing issued through Trino can modify it.
connector.name=postgresql
connection-url=jdbc:postgresql://${ENV:TRIBUTARY_PG_HOST}:${ENV:TRIBUTARY_PG_PORT}/${ENV:TRIBUTARY_PG_DATABASE}
connection-user=${ENV:TRIBUTARY_READER_USER}
connection-password=${ENV:TRIBUTARY_READER_PASSWORD}
