# The lake: the same Iceberg JDBC catalog the Spark job commits to (catalog name
# "lake", tables in PostgreSQL schema iceberg_catalog), data files on MinIO.
connector.name=iceberg
iceberg.catalog.type=jdbc
iceberg.jdbc-catalog.catalog-name=lake
iceberg.jdbc-catalog.driver-class=org.postgresql.Driver
iceberg.jdbc-catalog.connection-url=jdbc:postgresql://${ENV:TRIBUTARY_PG_HOST}:${ENV:TRIBUTARY_PG_PORT}/${ENV:TRIBUTARY_PG_DATABASE}?currentSchema=iceberg_catalog
iceberg.jdbc-catalog.connection-user=${ENV:TRIBUTARY_PG_USER}
iceberg.jdbc-catalog.connection-password=${ENV:TRIBUTARY_PG_PASSWORD}
iceberg.jdbc-catalog.default-warehouse-dir=s3://lake/warehouse
iceberg.file-format=PARQUET
fs.native-s3.enabled=true
s3.endpoint=${ENV:TRIBUTARY_S3_ENDPOINT}
s3.region=${ENV:TRIBUTARY_S3_REGION}
s3.path-style-access=true
s3.aws-access-key=${ENV:TRIBUTARY_S3_ACCESS_KEY}
s3.aws-secret-key=${ENV:TRIBUTARY_S3_SECRET_KEY}
# Floor for expire_snapshots / remove_orphan_files, matching TRIBUTARY_LAKE_SNAPSHOT_RETENTION.
# A day is far above any stream restart window (the sink's committed-batch check
# walks snapshot ancestry) and keeps a minute-trigger table at ~1,500 snapshots.
iceberg.expire-snapshots.min-retention=1d
iceberg.remove-orphan-files.min-retention=1d
