# Kafka (KRaft), PostgreSQL, MinIO, the Spark stream job writing both the
# warehouse and the Iceberg lake, and a producer that replays the committed
# sample once: `docker compose up -d`. Profile `lakehouse` adds Trino; profile
# `airflow` adds the scheduler and its UI.
name: tributary

x-app: &app
  build:
    context: .
    dockerfile: docker/spark/Dockerfile
  image: tributary-stream:dev
  environment:
    TRIBUTARY_KAFKA_BOOTSTRAP: kafka:9092
    TRIBUTARY_TOPIC: ${TRIBUTARY_TOPIC:-wiki.recentchange}
    TRIBUTARY_TOPIC_PARTITIONS: ${TRIBUTARY_TOPIC_PARTITIONS:-3}
    TRIBUTARY_PG_HOST: postgres
    TRIBUTARY_PG_PORT: "5432"
    TRIBUTARY_PG_DATABASE: ${TRIBUTARY_PG_DATABASE:-tributary}
    TRIBUTARY_PG_USER: ${TRIBUTARY_PG_USER:-tributary}
    TRIBUTARY_PG_PASSWORD: ${TRIBUTARY_PG_PASSWORD:-tributary}
    TRIBUTARY_PRODUCE_RATE: ${TRIBUTARY_PRODUCE_RATE:-500}
    TRIBUTARY_WATERMARK_DELAY: ${TRIBUTARY_WATERMARK_DELAY:-10 minutes}
    TRIBUTARY_TRIGGER_INTERVAL: ${TRIBUTARY_TRIGGER_INTERVAL:-5 seconds}
    TRIBUTARY_MAX_OFFSETS_PER_TRIGGER: ${TRIBUTARY_MAX_OFFSETS_PER_TRIGGER:-20000}
    TRIBUTARY_SPARK_MASTER: local[${TRIBUTARY_TOPIC_PARTITIONS:-3}]
    TRIBUTARY_LOG_LEVEL: ${TRIBUTARY_LOG_LEVEL:-INFO}
    TRIBUTARY_LAKE_ENABLED: ${TRIBUTARY_LAKE_ENABLED:-true}
    TRIBUTARY_LAKE_TRIGGER_INTERVAL: ${TRIBUTARY_LAKE_TRIGGER_INTERVAL:-1 minute}
    <<: &s3
      TRIBUTARY_S3_ENDPOINT: http://minio:9000
      TRIBUTARY_S3_REGION: ${TRIBUTARY_S3_REGION:-us-east-1}
      TRIBUTARY_S3_ACCESS_KEY: ${TRIBUTARY_S3_ACCESS_KEY:-tributary}
      TRIBUTARY_S3_SECRET_KEY: ${TRIBUTARY_S3_SECRET_KEY:-tributary-dev-secret}

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${TRIBUTARY_PG_USER:-tributary}
      POSTGRES_PASSWORD: ${TRIBUTARY_PG_PASSWORD:-tributary}
      POSTGRES_DB: ${TRIBUTARY_PG_DATABASE:-tributary}
      TRIBUTARY_READER_USER: ${TRIBUTARY_READER_USER:-tributary_reader}
      TRIBUTARY_READER_PASSWORD: ${TRIBUTARY_READER_PASSWORD:-tributary_reader}
    ports:
      - "127.0.0.1:${TRIBUTARY_PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Airflow's database, the schemas and the read-only role, on first start.
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 1g

  kafka:
    image: apache/kafka:4.2.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # kafka:9092 inside the Compose network, localhost:9094 from the host.
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created by the producer and the stream job with the configured partitions.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    ports:
      # Loopback only: the broker is unauthenticated and the database uses dev credentials.
      - "127.0.0.1:9094:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
    mem_limit: 1g

  minio:
    build:
      context: docker/minio
    image: tributary-minio:dev
    environment:
      MINIO_ROOT_USER: ${TRIBUTARY_S3_ACCESS_KEY:-tributary}
      MINIO_ROOT_PASSWORD: ${TRIBUTARY_S3_SECRET_KEY:-tributary-dev-secret}
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 512m

  # Creates the `lake` bucket once (an S3 PUT signed with curl's SigV4 support);
  # an existing bucket answers 409, which is fine.
  lake-init:
    image: tributary-minio:dev
    depends_on:
      minio:
        condition: service_healthy
    environment:
      <<: *s3
    entrypoint: ["sh", "-c"]
    command:
      - >-
        code=$$(curl -s -o /dev/null -w '%{http_code}' -X PUT
        --aws-sigv4 "aws:amz:$${TRIBUTARY_S3_REGION}:s3"
        --user "$${TRIBUTARY_S3_ACCESS_KEY}:$${TRIBUTARY_S3_SECRET_KEY}"
        http://minio:9000/lake);
        echo "create bucket lake: HTTP $$code";
        [ "$$code" = 200 ] || [ "$$code" = 409 ]
    restart: "no"

  stream:
    <<: *app
    command: ["stream"]
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      lake-init:
        condition: service_completed_successfully
    volumes:
      - checkpoints:/data/checkpoints
    # Healthy once the Spark driver is up and serving its REST API, so
    # `up --wait` fails fast on a job that crashes at start-up.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4040/api/v1/applications > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 90s
    # Time for query.stop() and spark.stop() after SIGTERM.
    stop_grace_period: 30s
    restart: unless-stopped
    mem_limit: 3g

  producer:
    <<: *app
    command: ["produce"]
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    mem_limit: 512m

  trino:
    image: trinodb/trino:484
    profiles: [lakehouse]
    depends_on:
      postgres:
        condition: service_healthy
      lake-init:
        condition: service_completed_successfully
    environment:
      <<: *s3
      TRIBUTARY_PG_HOST: postgres
      TRIBUTARY_PG_PORT: "5432"
      TRIBUTARY_PG_DATABASE: ${TRIBUTARY_PG_DATABASE:-tributary}
      TRIBUTARY_PG_USER: ${TRIBUTARY_PG_USER:-tributary}
      TRIBUTARY_PG_PASSWORD: ${TRIBUTARY_PG_PASSWORD:-tributary}
      TRIBUTARY_READER_USER: ${TRIBUTARY_READER_USER:-tributary_reader}
      TRIBUTARY_READER_PASSWORD: ${TRIBUTARY_READER_PASSWORD:-tributary_reader}
    volumes:
      - ./docker/trino/catalog:/etc/trino/catalog:ro
    ports:
      - "127.0.0.1:${TRIBUTARY_TRINO_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "/usr/lib/trino/bin/health-check"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    # The image sizes the heap at 80% of the container limit: 1.6 GB.
    mem_limit: 2g

volumes:
  pgdata:
  kafka-data:
  checkpoints:
  minio-data:
