# The ingest spine: Kafka (KRaft) and PostgreSQL, the Spark stream job, and a
# producer that replays the committed sample once. `docker compose up -d`.
name: tributary

x-app: &app
  build:
    context: .
    dockerfile: docker/spark/Dockerfile
  image: tributary-stream:dev
  environment:
    TRIBUTARY_KAFKA_BOOTSTRAP: kafka:9092
    TRIBUTARY_TOPIC: ${TRIBUTARY_TOPIC:-wiki.recentchange}
    TRIBUTARY_TOPIC_PARTITIONS: ${TRIBUTARY_TOPIC_PARTITIONS:-3}
    TRIBUTARY_PG_HOST: postgres
    TRIBUTARY_PG_PORT: "5432"
    TRIBUTARY_PG_DATABASE: ${TRIBUTARY_PG_DATABASE:-tributary}
    TRIBUTARY_PG_USER: ${TRIBUTARY_PG_USER:-tributary}
    TRIBUTARY_PG_PASSWORD: ${TRIBUTARY_PG_PASSWORD:-tributary}
    TRIBUTARY_PRODUCE_RATE: ${TRIBUTARY_PRODUCE_RATE:-500}
    TRIBUTARY_WATERMARK_DELAY: ${TRIBUTARY_WATERMARK_DELAY:-10 minutes}
    TRIBUTARY_TRIGGER_INTERVAL: ${TRIBUTARY_TRIGGER_INTERVAL:-5 seconds}
    TRIBUTARY_MAX_OFFSETS_PER_TRIGGER: ${TRIBUTARY_MAX_OFFSETS_PER_TRIGGER:-20000}
    TRIBUTARY_SPARK_MASTER: local[${TRIBUTARY_TOPIC_PARTITIONS:-3}]
    TRIBUTARY_LOG_LEVEL: ${TRIBUTARY_LOG_LEVEL:-INFO}

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${TRIBUTARY_PG_USER:-tributary}
      POSTGRES_PASSWORD: ${TRIBUTARY_PG_PASSWORD:-tributary}
      POSTGRES_DB: ${TRIBUTARY_PG_DATABASE:-tributary}
    ports:
      - "${TRIBUTARY_PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 1g

  kafka:
    image: apache/kafka:4.2.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # kafka:9092 inside the Compose network, localhost:9094 from the host.
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created by the producer and the stream job with the configured partitions.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    ports:
      - "9094:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
    mem_limit: 1g

  stream:
    <<: *app
    command: ["stream"]
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - checkpoints:/data/checkpoints
    restart: unless-stopped
    mem_limit: 3g

  producer:
    <<: *app
    command: ["produce"]
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    mem_limit: 512m

volumes:
  pgdata:
  kafka-data:
  checkpoints:
