[project]
name = "tributary"
version = "0.1.0.dev0"
description = "Streaming data platform with an evaluated analytics agent"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.16,<3",
    "httpx>=0.28,<1",
    "psycopg[binary]>=3.3,<4",
    "pydantic-settings>=2.16,<3",
    "structlog>=26.1",
    "typer>=0.27,<1",
]

[project.optional-dependencies]
# Matches the apache/spark:4.1.3 image used by the stream container.
spark = ["pyspark==4.1.3"]

[project.scripts]
tributary = "tributary.cli:app"

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pytest>=9.1",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tributary"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "S", "PT", "TID"]
ignore = ["S101", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["tributary", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-ra --strict-markers"
markers = [
    "spark: needs pyspark and a JVM (runs offline in local mode)",
    "integration: needs the Compose services (Kafka, Spark, PostgreSQL)",
]
