[project]
name = "tributary-platform"
version = "0.1.0"
description = "Streaming data platform with an evaluated analytics agent"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["text-to-sql", "kafka", "spark", "dbt", "iceberg", "data-engineering", "llm-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = [
    "anthropic>=1.15,<2",
    "confluent-kafka>=2.16,<3",
    "httpx>=0.28,<1",
    "psycopg[binary]>=3.3,<4",
    "pydantic-settings>=2.16,<3",
    "pyyaml>=6.0,<7",
    "sqlglot>=30.23,<31",
    "structlog>=26.1",
    "typer>=0.27,<1",
]

[project.optional-dependencies]
# The HTTP serving layer (`tributary serve`); the CLI and the agent work without it.
api = ["fastapi>=0.136,<1", "uvicorn>=0.40,<1"]
# Matches the apache/spark:4.1.3 image used by the stream container.
spark = ["pyspark==4.1.3"]
# dbt runs the warehouse models and tests; dbt-postgres has no 1.12 release yet.
warehouse = ["dbt-core>=1.12.6,<1.13", "dbt-postgres>=1.11,<1.12"]
# Trino client for lake maintenance, reconciliation and the query benchmarks.
lakehouse = ["trino>=0.340,<1"]
# The scheduler, its DAGs and dag.test(); the Airflow image installs this extra.
airflow = ["apache-airflow==3.3.2"]

[project.urls]
Repository = "https://github.com/TheAsianFish/tributary"
Changelog = "https://github.com/TheAsianFish/tributary/blob/main/CHANGELOG.md"

[project.scripts]
tributary = "tributary.cli:app"

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pytest>=9.1",
    "ruff>=0.17",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tributary"]

# The sdist is the package and what building it needs; the sample, the BIRD files,
# the recordings and the benchmark results stay in the repository.
[tool.hatch.build.targets.sdist]
include = ["/tributary", "/README.md", "/LICENSE", "/CHANGELOG.md", "/pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "S", "PT", "TID"]
ignore = ["S101", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
# The benchmark drivers run docker and docker compose by design (fixed argv, no shell).
"bench/**" = ["S603", "S607"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["tributary", "tests", "orchestration", "eval", "bench"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-ra --strict-markers"
markers = [
    "spark: needs pyspark and a JVM (runs offline in local mode)",
    "integration: needs the Compose services (Kafka, Spark, PostgreSQL, MinIO)",
    "warehouse: needs PostgreSQL only (TRIBUTARY_PG_*), with dbt and Airflow installed",
    "lakehouse: needs the Compose stack with the lakehouse profile (Trino)",
    "live: calls a real model API (needs ANTHROPIC_API_KEY; skipped without it)",
]
