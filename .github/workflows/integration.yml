name: Integration

# Kafka + Spark + PostgreSQL under Compose, 5,000 events end to end. Runs only
# when the ingest path changes (or by hand) to keep CI minutes for the gate.
on:
  pull_request:
    paths:
      - "tributary/**"
      - "tests/integration/**"
      - "docker/**"
      - "compose.yaml"
      - "data/sample/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/integration.yml"
  push:
    branches: [main]
    paths:
      - "tributary/**"
      - "tests/integration/**"
      - "docker/**"
      - "compose.yaml"
      - "data/sample/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/integration.yml"
  workflow_dispatch:

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pipeline:
    name: replay 5,000 events through Kafka and Spark
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked
      - name: Build the stream image
        run: docker compose build stream
      - name: Start Kafka, PostgreSQL and the stream job
        run: docker compose up -d --wait postgres kafka stream
      - run: make test-integration
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --tail 300
      - name: Tear down
        if: always()
        run: docker compose down -v
