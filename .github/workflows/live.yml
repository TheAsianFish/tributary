name: Live

# Calls the real Anthropic API, so it never runs on a push or a pull request: run it
# by hand (Actions -> Live -> Run workflow). Without the ANTHROPIC_API_KEY repository
# secret every step is skipped and the run is green. `bird` adds BIRD dev50 on the
# chosen model, recorded (estimated cost in RESULTS.md, "To measure"); the recordings
# are uploaded as an artifact to commit by hand.
on:
  workflow_dispatch:
    inputs:
      model:
        description: Model for the live calls
        default: claude-haiku-5-5
      bird:
        description: Also run BIRD dev50 live and record it
        type: boolean
        default: false

concurrency:
  group: live
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  live:
    name: provider and (optionally) BIRD dev50 against the API
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TRIBUTARY_LIVE_MODEL: ${{ inputs.model }}
      TRIBUTARY_PG_PASSWORD: tributary
    services:
      postgres:
        image: postgres:17.11@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
        env:
          POSTGRES_USER: tributary
          POSTGRES_PASSWORD: tributary
          POSTGRES_DB: tributary
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tributary" --health-interval 5s --health-retries 20
    steps:
      - name: Skip without the secret
        id: key
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::ANTHROPIC_API_KEY is not set; nothing to run"; fi
      - if: steps.key.outputs.present == 'true'
        uses: actions/checkout@v4
      - if: steps.key.outputs.present == 'true'
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          enable-cache: true
          python-version: "3.12"
      - if: steps.key.outputs.present == 'true'
        run: uv sync --locked
      - if: steps.key.outputs.present == 'true'
        run: make test-live
      - if: steps.key.outputs.present == 'true' && inputs.bird
        run: make bird
      - if: steps.key.outputs.present == 'true' && inputs.bird
        run: make eval PROVIDER=anthropic MODEL="$TRIBUTARY_LIVE_MODEL" RECORD=1
      - if: steps.key.outputs.present == 'true' && inputs.bird
        uses: actions/upload-artifact@v4
        with:
          name: bird-${{ inputs.model }}
          path: |
            eval/results/
            tests/recordings/
            RESULTS.md
